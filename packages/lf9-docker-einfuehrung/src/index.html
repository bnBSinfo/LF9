<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lernpaket</title>
<link rel="stylesheet" href="css/stil.css?v=0.28">
<link rel="stylesheet" href="css/baukasten.css?v=0.28">
<link rel="stylesheet" href="css/tafel.css?v=0.28">
</head>
<body>
<div class="app" id="app">
  <header class="kopf card">
    <div class="logo" aria-hidden="true"></div>
    <div class="titel"><h1 id="titel"></h1><div class="unter" id="untertitel"></div></div>
    <div class="fortschritt" id="fortschritt" aria-live="polite"></div>
  </header>
  <nav class="tabs card" id="tabs" aria-label="Teile des Lernpakets"></nav>
  <main id="haupt" tabindex="-1"></main>
  <footer class="leiste card" id="leiste"></footer>
  <div class="fuss" id="fuss"></div>
</div>
<script src="js/baukasten.js?v=0.28"></script>  <!-- Bausteine für Szenen (window.KIT) -->
<script src="js/stufen.js?v=0.28"></script>  <!-- Differenzierung: L(), P(), Basis/Profi (P15, P16) -->
<script src="js/inhalt.js?v=0.28"></script>
<script src="js/raeume.js?v=0.28"></script>  <!-- Räume 2–5 von „Serverraum 0“ -->
<script src="js/nachweis.js?v=0.28"></script>  <!-- Nachweis: Raum „Redaktion“, Fragenpool, Merkblatt -->
<script src="js/uebungen.js?v=0.28"></script>  <!-- Übungen 2–6 -->
<script src="js/erklaerung.js?v=0.28"></script>  <!-- So funktioniert Docker: Erklär-Szenen (PAKET.tafel) -->
<script src="js/sprache.js?v=0.28"></script>  <!-- Sprachstufe Einfach + Umschalter (P16) -->
<script src="js/tafel.js?v=0.28"></script>  <!-- optionales Tafelbild; tut nichts ohne PAKET.tafel -->
<script src="js/pdf.js?v=0.28"></script>  <!-- PDF erstellen (Download) für Lernheft, Merkblatt, Ergebnis -->
<script src="js/engine.js?v=0.28"></script>
</body>
</html>
